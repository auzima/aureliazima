<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aureliazima.ch</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      
      canvas#game {
        display: block;
        width: 100dvw;
        height: 100dvh;
        background: #ffffff;
      }
      
      #app {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
      }
      
      #app > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
